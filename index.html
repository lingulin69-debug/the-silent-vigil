<style>
    /* 1. 基礎設定與效能優化 */
    * { -webkit-tap-highlight-color: transparent; }
    body { 
        background-color: #050505; color: #e5e5e5; overflow-x: hidden; overflow-y: auto;
        font-family: 'Noto Serif SC', serif; -webkit-font-smoothing: antialiased;
    }
    button, .tarot-card { user-select: none; -webkit-user-select: none; }
    .text-glow { text-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 0 0 30px rgba(255, 255, 255, 0.2); }
    .red-flower-effect { color: #cc0000; text-shadow: 0 0 25px rgba(204, 0, 0, 0.7); font-weight: 900; }

    /* 2. 卡牌樣式 (保持原樣) */
    .tarot-card { 
        position: relative; z-index: 10;
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), background 0.3s ease, box-shadow 0.3s ease, opacity 0.8s ease, filter 0.8s ease; 
        border-radius: 0.5rem; background: rgba(0, 0, 0, 0.29); border: 1px solid rgba(255, 255, 255, 0.1); 
        aspect-ratio: 2 / 3.8; display: flex; flex-direction: column; justify-content: space-between; 
        padding: 2.2rem 0.4rem; width: 100%; min-height: 200px; overflow: visible; cursor: pointer;
    }
    .tarot-card:hover:not(.card-vanish-effect) {
        z-index: 500; transform: translateY(-15px); box-shadow: 0 0 25px rgba(204, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.5);
    }
    .tarot-card.card-vanish-effect {
        opacity: 0 !important; transform: scale(0.8) translateY(40px) !important;
        filter: blur(20px) !important; pointer-events: none !important; z-index: 0 !important;
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .shape-container { transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; justify-content: center; position: relative; pointer-events: none; }
    .shape-container::after { display: none !important; }
    .shape-container > div { transition: transform 0.6s ease; }
    .tarot-card:hover:not(.card-vanish-effect) .shape-container { transform: rotate(360deg); }
    .tarot-card:hover:not(.card-vanish-effect) .shape-container > div { transform: scale(1.1); }
    .tarot-card:active:not(.card-vanish-effect) { transform: scale(0.98) translateY(-10px); }
    @media (max-width: 640px) { .tarot-card { padding: 1.5rem 0.3rem; min-height: 180px; } }

    /* 3. 核心動畫系統 (文字與圖片) */
    /* 統一初始隱藏，防止跳動閃爍 */
    .animate-pop, 
    .animate-spread,
    .animate-colorize {
        opacity: 0; 
        will-change: transform, opacity, filter;
    }

    /* 執行動畫：強制連動 HTML 變數 */
    .step-content.active .animate-pop {
        animation: fadeInPopFinal var(--dur, 4s) ease-in-out var(--delay, 0s) forwards !important;
    }
    .step-content.active .animate-spread {
        animation: fadeInSpreadFinal var(--dur, 4s) ease-in-out var(--delay, 0s) forwards !important;
    }
    .step-content.active .animate-colorize {
        animation: fadeInColorizeFinal var(--dur, 6s) ease-in-out var(--delay, 0s) forwards !important;
    }

    /* 動畫路徑定義 (唯一版本) */
    @keyframes fadeInPopFinal {
        0% { opacity: 0; transform: translateY(20px); filter: blur(10px); }
        15% { opacity: 1; transform: translateY(0); filter: blur(0); }
        90% { opacity: 1; transform: translateY(0); filter: blur(0); }
        100% { opacity: 0; transform: translateY(-10px); filter: blur(5px); }
    }

    @keyframes fadeInSpreadFinal {
        0% { opacity: 0; letter-spacing: -0.2em; filter: blur(10px); }
        15% { opacity: 1; letter-spacing: normal; filter: blur(0); }
        90% { opacity: 1; letter-spacing: normal; filter: blur(0); }
        100% { opacity: 0; letter-spacing: 0.1em; filter: blur(5px); }
    }

    @keyframes fadeInColorizeFinal {
    0% { 
        opacity: 0; 
        filter: brightness(0) grayscale(1) blur(10px); /* 初始：全黑、黑白、模糊 */
        transform: scale(1); /* 固定比例，防止縮放 */
    }
    20% { 
        opacity: 0.8; 
        filter: brightness(0.9) grayscale(0) blur(0); /* 進場：變亮、彩色、清晰 */
        transform: scale(1); 
    }
    85% { 
        opacity: 0.8; 
        filter: brightness(0.9) grayscale(0) blur(0); 
        transform: scale(1);
    }
    100% { 
        opacity: 0; 
        filter: brightness(0.4) blur(20px); 
        transform: scale(1); /* 消失：變暗模糊，但不縮放 */
    }
}

    /* 4. 排版與背景 (保持原樣) */
    .vertical-text { writing-mode: vertical-rl; text-orientation: upright; }
    @media (max-width: 640px) { .vertical-text { writing-mode: horizontal-tb; text-orientation: mixed; } }
    .step-content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.8s ease-out; z-index: 50; padding: 1rem; }
    .step-content.active { opacity: 1; transition: opacity 2.5s ease-in; }
    .fixed-bg { position: fixed; inset: 0; background: url('./assets/bg/bg_scene1_blur.webp') center/cover no-repeat; filter: brightness(0.2) blur(10px); z-index: -3; transform: scale(1.1); }
    .loading { position: fixed; inset: 0; background: #050505; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease; }
    .loading.hidden { opacity: 0; pointer-events: none; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

            },
            { 
                id: 11, roman: "XI", title: "BROKEN", cnTitle: "碎裂", 
                desc: "約定已經完成了。", 
                shape: "border: 1px solid white; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); width: 50px; height: 50px;" 
            },
            { 
                id: 12, roman: "XII", title: "END", cnTitle: "结局", 
                desc: "一聲巨響劃破了死寂。", 
                shape: "border: 1.5px dashed #cc0000; border-radius: 50%; width: 55px; height: 55px;" 
            },
            { 
                id: 13, roman: "XIII", title: "SILENCE", cnTitle: "静默", 
                desc: "你聽見花開的聲音了嗎？", 
                shape: "border-bottom: 1.5px solid white; width: 70px; height: 1px;" 
            }
        ];

        // ============================================
        // 狀態管理
        // ============================================
        
        let visitedCards = new Set();
        let lastId = null;
        let isMuted = false;
        let currentAudio = null;
        let currentStep = 0;
        let isTransitioning = false;
        let isInitialized = false;

        // ============================================
        // 初始化函數
        // ============================================
        
        function init() {
            if (isInitialized) return;
            isInitialized = true;

            try {
                // 初始化音訊
                currentAudio = document.getElementById('bg-ambience');
                currentAudio.volume = 0;

                // 生成卡牌
                generateCards();

                // 初始化圖示
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }

                // 隱藏載入畫面
                setTimeout(() => {
                    const loadingScreen = document.getElementById('loading-screen');
                    if (loadingScreen) {
                        loadingScreen.classList.add('hidden');
                    }
                }, 500);

                console.log('✓ 應用程式初始化完成');
            } catch (error) {
                console.error('初始化失敗:', error);
                alert('載入失敗，請重新整理頁面');
            }
        }

        // ============================================
        // 卡牌生成
        // ============================================
        
        function generateCards() {
            const grid = document.getElementById('card-grid');
            if (!grid) return;

            cardsData.forEach((card, index) => {
                const wrap = document.createElement('div');
                wrap.id = `card-wrap-${card.id}`;
                wrap.className = 'opacity-0 animate-fade-in-up';
                wrap.style.animationDelay = `${index * 0.05}s`;
                wrap.setAttribute('role', 'listitem');
                
                wrap.innerHTML = `
                    <div 
                        class="tarot-card cursor-pointer group gpu-accelerated" 
                        onclick="openModal(${card.id})"
                        role="button"
                        tabindex="0"
                        aria-label="${card.cnTitle} - ${card.desc}"
                        onkeydown="if(event.key==='Enter'||event.key===' ')openModal(${card.id})">
                        <span class="font-serif text-white/20 text-[9px] md:text-[10px] tracking-[0.4em] text-center w-full block" aria-hidden="true">
                            ${card.roman}
                        </span>
                        <div class="flex justify-center items-center flex-grow">
                            <div class="shape-container">
                                <div style="${card.shape || ''}" aria-hidden="true"></div>
                            </div>
                        </div>
                        <div class="text-center px-1">
                            <h3 class="font-serif text-white/30 uppercase text-[8px] md:text-[9px] tracking-widest" aria-hidden="true">
                                ${card.title}
                            </h3>
                            <h2 class="font-sc text-[16px] md:text-[18px] text-white tracking-[0.2em] font-black">
                                ${card.cnTitle}
                            </h2>
                        </div>
                    </div>
                `;
                grid.appendChild(wrap);
            });
        }

        // ============================================
        // 模態視窗控制
        // ============================================
        
        function openModal(id) {
            try {
                lastId = id;
                const card = cardsData.find(c => c.id === id);
                if (!card) return;

                // 更新模態內容
                document.getElementById('modal-number').innerText = `${card.roman} / MEMORY FRAGMENT`;
                document.getElementById('modal-title').innerText = card.title;
                document.getElementById('modal-desc').innerText = card.desc;

                // 顯示模態
                const modal = document.getElementById('modal');
                modal.classList.remove('pointer-events-none');
                modal.style.opacity = '1';

                // 播放音效
                if (!isMuted) {
                    const sfx = document.getElementById('touch-sfx');
                    if (sfx) {
                        sfx.volume = CONFIG.AUDIO_VOLUME.SFX;
                        sfx.currentTime = 0;
                        sfx.play().catch(err => console.log('音效播放失敗:', err));
                    }
                }

                // 更新狀態
                visitedCards.add(id);
                updateProgress();
            } catch (error) {
                console.error('開啟模態視窗失敗:', error);
            }
        }

 function closeModal() {
    try {
        const modal = document.getElementById('modal');
        modal.style.opacity = '0';
        
        setTimeout(() => {
            modal.classList.add('pointer-events-none');
        }, CONFIG.TIMING.MODAL_FADE);

        // --- 修正部分開始 ---
        if (lastId !== null) {
            // 找到該卡牌外層的 wrap
            const cardWrap = document.getElementById(`card-wrap-${lastId}`);
            if (cardWrap) {
                // 找到真正的卡牌本體
                const actualCard = cardWrap.querySelector('.tarot-card');
                if (actualCard) {
                    actualCard.classList.add('card-vanish-effect');
                }
            }
        }
        // --- 修正部分結束 ---

        // 檢查是否完成
        if (visitedCards.size === cardsData.length) {
            setTimeout(() => {
                triggerFinale();
            }, CONFIG.TIMING.CARD_VANISH);
        }
    } catch (error) {
        console.error('關閉模態視窗失敗:', error);
    }
}

        // ============================================
        // 進度更新
        // ============================================
        
        function updateProgress() {
            const remaining = cardsData.length - visitedCards.size;
            const progressText = document.getElementById('progress-text');
            if (progressText) {
                progressText.innerText = `。 剩余碎片：${remaining} 。`;
            }
        }

        // ============================================
        // 終章觸發
        // ============================================
        
function triggerFinale() {
    try {
        const mainUi = document.getElementById('main-interface');
        const bgAmbience = document.getElementById('bg-ambience');
        const touchSfx = document.getElementById('touch-sfx');
        const finaleMusic = document.getElementById('finale-music');

        // 【重點 1】點擊瞬間解鎖音軌
        if (finaleMusic) {
            finaleMusic.muted = true;
            finaleMusic.play().then(() => {
                finaleMusic.pause();
                finaleMusic.muted = false;
            }).catch(e => console.log("Unlock failed"));
        }

        // 【重點 2】徹底切斷舊音軌，解決雜音
        if (bgAmbience) {
            bgAmbience.pause();
            bgAmbience.src = ""; // 切斷串流
            bgAmbience.load();
        }
        // 同時讓全域變數失效，防止 click 事件重啟它
        currentAudio = null; 

        if (touchSfx) {
            touchSfx.pause();
            touchSfx.muted = true;
        }

        if (mainUi) mainUi.style.opacity = '0';

        setTimeout(() => {
            if (mainUi) mainUi.style.display = 'none';
            const finalPage = document.getElementById('final-story-page');
            if (finalPage) finalPage.classList.remove('hidden');

            setTimeout(() => {
                if (finaleMusic) {
                    window.currentAudio = finaleMusic; // 重新接管控制權
                    finaleMusic.volume = 0.3;
                    finaleMusic.play();
                }
                if (typeof startAutoPlay === 'function') startAutoPlay();
            }, 500); // 縮短延遲以符合手機政策
        }, 1500);
    } catch (error) {
        console.error('觸發終章失敗:', error);
    }
}
        // ============================================
        // 自動播放控制
        // ============================================
        
 function startAutoPlay() {
            let stepIndex = 0;
            
            function runNext() {
                if (stepIndex < CONFIG.STAGE_TIMINGS.length - 1) {
                    setTimeout(() => {
                        advanceFinale();
                        stepIndex++;
                        runNext();
                    }, CONFIG.STAGE_TIMINGS[stepIndex]);
                } else {
                    setTimeout(() => {
                        // 故事結束，不跳出提示框。
                        // 如果想讓它自動重新開始，取消下面這行的註解：
                        // location.reload();
                        console.log("Story ended.");
                    }, CONFIG.STAGE_TIMINGS[stepIndex]);
                }
            }
            
            runNext();
        }

        // ============================================
        // 故事推進
        // ============================================
        
        function advanceFinale() {
            if (isTransitioning) return;
            
            try {
                const steps = document.querySelectorAll('.step-content');
                const fixedBg = document.querySelector('.fixed-bg');
                
                if (!steps.length || currentStep >= steps.length) return;
                
                isTransitioning = true;

                // 淡出當前段落
                steps[currentStep].classList.remove('active');
                
                // 過渡延遲
                setTimeout(() => {
                    currentStep++;
                    if (currentStep >= steps.length) {
                        isTransitioning = false;
                        return;
                    }

                    const nextStep = steps[currentStep];
                    
                    // 處理背景圖片
                    const stepImg = nextStep.querySelector('img');
                    if (stepImg && fixedBg) {
                        fixedBg.style.backgroundImage = `url('${stepImg.src}')`;
                        fixedBg.style.filter = "brightness(0.15) blur(35px)";
                    } else if (fixedBg) {
                        fixedBg.style.filter = "brightness(0.12) blur(40px)";
                    }

                    // 顯示下一段落
                    nextStep.classList.add('active');
                    
                    setTimeout(() => {
                        isTransitioning = false;
                    }, 2000);
                }, CONFIG.TIMING.STEP_TRANSITION);
            } catch (error) {
                console.error('故事推進失敗:', error);
                isTransitioning = false;
            }
        }

        // ============================================
        // 音訊控制
        // ============================================
        
        function toggleMute() {
            try {
                isMuted = !isMuted;
                
                // 更新所有音訊元素
                if (currentAudio) {
                    currentAudio.muted = isMuted;
                }
                
                const touchSfx = document.getElementById('touch-sfx');
                if (touchSfx) {
                    touchSfx.muted = isMuted;
                }

                // 更新按鈕狀態
                const audioBtn = document.getElementById('audio-control');
                if (audioBtn) {
                    audioBtn.setAttribute('aria-pressed', isMuted ? 'true' : 'false');
                }

                // 更新圖示
                const muteIcon = document.getElementById('mute-icon');
                if (muteIcon) {
                    muteIcon.setAttribute('data-lucide', isMuted ? 'volume-x' : 'volume-2');
                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                }
            } catch (error) {
                console.error('切換靜音失敗:', error);
            }
        }

        function fadeOutAudio(audio, duration) {
            if (!audio) return;
            
            const startVolume = audio.volume;
            const step = startVolume / (duration / 50);
            
            const fadeInterval = setInterval(() => {
                if (audio.volume > step) {
                    audio.volume -= step;
                } else {
                    audio.volume = 0;
                    audio.pause();
                    clearInterval(fadeInterval);
                }
            }, 50);
        }

        // ============================================
        // 點擊效果
        // ============================================
        
     window.addEventListener('click', (e) => {
    try {
        // ... 原有的效果代碼 ...
        const effect = document.createElement('div');
        // ... (保持你原本創建 effect 的內容) ...

        // 【重點 3】修正啟動邏輯：只有在 currentAudio 存在且是環境音時才啟動
        // 這樣進入結局後（currentAudio 已被設為 null 或 finaleMusic），就不會重啟風聲
        if (currentAudio && currentAudio.id === 'bg-ambience' && currentAudio.paused) {
            currentAudio.volume = CONFIG.AUDIO_VOLUME.BACKGROUND;
            currentAudio.play().catch(err => console.log('音訊播放失敗:', err));
        }
    } catch (error) {
        console.error('點擊效果失敗:', error);
    }
});

        // ============================================
        // 錯誤處理
        // ============================================
        
        window.addEventListener('error', (e) => {
            console.error('全域錯誤:', e.error);
        });

        window.addEventListener('unhandledrejection', (e) => {
            console.error('未處理的 Promise 拒絕:', e.reason);
        });

        // ============================================
        // 頁面載入完成後初始化
        // ============================================
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // 防止右鍵選單 (可選)
        document.addEventListener('contextmenu', (e) => {
          
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
            }
        });

        console.log('🌙 THE SILENT VIGIL - 程式碼已載入');
    </script>
